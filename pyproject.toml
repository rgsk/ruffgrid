[project]
name = "ruffgrid"
version = "0.1.0"
description = "Ruff's language server for .py files and notebooks, with grids: brackets packed several items to a line stay packed."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["ruff>=0.16.10"]

[project.scripts]
ruffgrid = "ruffgrid.lsp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8",
]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]  # README examples are laid out by hand
